# SFT Configuration for Qwen2.5-7B-Instruct (image-prompt LoRA v2)
#
# Differences from v1:
#   - Dataset: v2 (~5,000 synthetic rows from Gemini, semantically deduplicated,
#       judge-filtered) instead of v1 (1,250 cleaned rows)
#   - num_train_epochs reduced 5 → 3: 4x more data → fewer passes needed,
#       still let early stopping decide
#   - logging_steps bumped 10 → 20 (more steps per epoch with larger dataset)
#
# Everything else (model, LoRA r/alpha, QLoRA, optimizer, eval/early stopping)
# is unchanged from v1 to make the v1↔v2 comparison clean.
#
# Build the v2 dataset first:
#   python scripts/synthesize_dataset_v2.py --dry-run --max-seeds 10   # smoke test
#   python scripts/synthesize_dataset_v2.py                            # full run

# Model
model_id: "Qwen/Qwen2.5-7B-Instruct"
trust_remote_code: true

# Dataset
dataset_id: "Limbicnation/images-diffusion-prompt-style-v2"
dataset_text_field: "text"
max_seq_length: 512

# LoRA (mirror v1/v7 capacity)
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Quantization (QLoRA)
use_4bit: true
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true

# Training (~5,000 rows; fewer epochs needed than v1's 1,250)
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 8          # effective batch = 8
auto_find_batch_size: false
learning_rate: 1.0e-4
warmup_ratio: 0.05
lr_scheduler_type: "cosine_with_min_lr"
lr_scheduler_kwargs:
  min_lr: 1.0e-6
weight_decay: 0.01

# Optimization
optim: "paged_adamw_8bit"
fp16: false
bf16: true
gradient_checkpointing: true
group_by_length: true

# Packing — false (prevents cross-example contamination)
packing: false

# Output
output_dir: "./outputs/qwen2-5-7b-image-prompt-lora-v2"
logging_steps: 20
save_strategy: "epoch"
push_to_hub: true
hub_model_id: "Limbicnation/qwen2-5-7b-image-prompt-lora-v2"

# Evaluation
eval_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# Early stopping
early_stopping_patience: 2          # tighter: more data + fewer epochs
early_stopping_threshold: 0.001

# Monitoring
report_to: "none"
wandb_project: "prompt-lora-trainer"
run_name: "sft-qwen2-5-7b-image-v2"
