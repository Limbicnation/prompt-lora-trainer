# SFT Configuration for Qwen2.5-7B-Instruct (dual-stream multi-dialect prompt LoRA)
#
# Trains the model to emit the right prompt DIALECT given a target_model instruction
# prefix (flux_t5 | sdxl_dual_clip | compact_caption | steering_modifiers).
#
# Derived from sft_qwen2_5_7b_image_v2_batch1.yaml — only dataset_id, hub_model_id,
# output_dir, and run_name differ. All hyperparameters are kept identical so results
# are comparable to the single-stream v2 model.
#
# Dataset: Limbicnation/dual-stream-image-prompts (22,878 rows; `text` field already
# rendered with the Qwen2.5 chat template). train_sft.py loads the Hub `train` split
# (20,590 rows) and self-splits 90/10 for eval.

# Model
model_id: "Qwen/Qwen2.5-7B-Instruct"
trust_remote_code: true

# Dataset
dataset_id: "Limbicnation/dual-stream-image-prompts"
dataset_text_field: "text"
max_seq_length: 512

# LoRA (mirror v1/v2/v7 capacity)
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Quantization (QLoRA)
use_4bit: true
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true

# Training (~18.5k train rows after internal split; let early stopping decide)
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 8          # effective batch = 8
auto_find_batch_size: false
learning_rate: 1.0e-4
warmup_ratio: 0.05
lr_scheduler_type: "cosine_with_min_lr"
lr_scheduler_kwargs:
  min_lr: 1.0e-6
weight_decay: 0.01

# Optimization
optim: "paged_adamw_8bit"
fp16: false
bf16: true
gradient_checkpointing: true
group_by_length: true

# Packing — false (prevents cross-example contamination)
packing: false

# Output
output_dir: "./outputs/qwen2-5-7b-dual-stream-prompt-lora"
logging_steps: 20
save_strategy: "epoch"
push_to_hub: true
hub_model_id: "Limbicnation/qwen2-5-7b-dual-stream-prompt-lora"

# Evaluation
eval_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# Early stopping
early_stopping_patience: 2
early_stopping_threshold: 0.001

# Monitoring
report_to: "none"
wandb_project: "prompt-lora-trainer"
run_name: "sft-qwen2-5-7b-dual-stream"
