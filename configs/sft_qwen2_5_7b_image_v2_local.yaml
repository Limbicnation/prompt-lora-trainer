model_id: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true
dataset_id: data/synthesize_v2_records.jsonl
dataset_text_field: text
max_seq_length: 512
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
use_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
auto_find_batch_size: false
learning_rate: 0.0001
warmup_ratio: 0.05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr: 1.0e-06
weight_decay: 0.01
optim: paged_adamw_8bit
fp16: false
bf16: true
gradient_checkpointing: true
group_by_length: false
packing: false
output_dir: ./outputs/qwen2-5-7b-image-prompt-lora-v2
logging_steps: 20
save_strategy: epoch
push_to_hub: true
hub_model_id: Limbicnation/qwen2-5-7b-image-prompt-lora-v2
eval_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_patience: 2
early_stopping_threshold: 0.001
report_to: none
wandb_project: prompt-lora-trainer
run_name: sft-qwen2-5-7b-image-v2
